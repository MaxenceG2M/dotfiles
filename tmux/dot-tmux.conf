# Tmux settings
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix

# Reload the file with Prefix r
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf reloaded!"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n C-M-Right next-window
bind -n C-M-Left previous-window

# Usefull command to have man page
bind / command-prompt "split-window -h 'exec man %%'"
bind ! command-prompt "split-window 'exec tldr --pager %%'"

# Create new pane in current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# General options
#set-option -g default-shell /bin/zsh
set-option -g history-limit 3000
# Set XTerm key bindings
setw -g xterm-keys on
# Set the default terminal mode to 256color mode
set -g default-terminal "screen-256color"
# Number windows starting at 1
set-option -g base-index 1
# set-option -g renumber-windows on
# Update the status bar every sixty seconds
set -g status-interval 60

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

## tmux-tomorrow style
## Source : https://raw.githubusercontent.com/edouard-lopez/tmux-tomorrow/master/tomorrow-night-bright.tmux
# Color key:
#   #000000 Background
#   #2a2a2a Current Line
#   #424242 Selection
#   #eaeaea Foreground
#   #969896 Comment
#   #d54e53 Red
#   #e78c45 Orange
#   #e7c547 Yellow
#   #b9ca4a Green
#   #70c0b1 Aqua
#   #7aa6da Blue
#   #c397d8 Purple


setw -g window-style 'bg=#2a2a2a'         # unactive panel style
setw -g window-active-style 'bg=#000000'  # solid background for active panel
setw -g window-style 'bg=#101010'         # unactive panel style
setw -g window-active-style bg=terminal   # transparent background for active panel

# Change style for unselected tabs with activity
# By default: window-status-activity-style -> reverse
# setw -g window-status-activity-style fg="#70c0b1"
# setw -g window-status-activity-style bg="#424242"

## style tabs
setw -g window-status-style bg=default
setw -g window-status-style fg=white
setw -g window-status-style none
## style of tab of current (selected) window
setw -g window-status-current-format '#[fg=#f99157,bg=#424242] #I #[fg=#cccccc] #W#F #[default]'
## style of (others) tab(s)
setw -g window-status-format '#[fg=#6699cc] #I #[fg=#999999] #W#F #[default]'

## pane border and colors - one solid line, no color diff.
set -g pane-active-border-style bg=default
set -g pane-active-border-style fg="#424242"
set -g pane-border-style bg=default
set -g pane-border-style fg="#424242"

# Clock-mode style (C-b t)
set -g clock-mode-colour "#7aa6da"
set -g clock-mode-style 24

## message bar or "prompt"
set -g message-command-style bg="#70c0b1"
set -g message-command-style fg="#000000"
set -g message-style bg="#2d2d2d"
set -g message-style fg="#cc99cc"

set -g mode-style bg="#000000"
set -g mode-style fg="#e78c45"

set -g status-style bg=default
## right side of status bar holds "[host name] (date time)"
set -g status-right-length 100
set -g status-right-style fg=black
set -g status-right-style bold
## Adapted with uptime
# set -g status-right '#[fg=#6699cc,bg=#2d2d2d] #(uptime | rev | cut -d" " -f1-3 | rev) |#[fg=#f99157] %H:%M |#[fg=#6699cc] %y.%m.%d '
# client_prefix => Highlight when tmux prefix is activated
set -g status-right '#[fg=#f99157] %H:%M |#[fg=#6699cc] %y.%m.%d'

## Highlight when tmux prefix is activated
set -g status-left "#{?client_prefix,#[bg=red],#[bg=#000000]}#[fg=colour250] #S "
